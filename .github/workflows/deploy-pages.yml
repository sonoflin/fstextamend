name: Deploy to GitHub Pages

# Publishes the static map to GitHub Pages. The first run auto-enables Pages
# for the repository (build type: GitHub Actions), so no manual Settings step
# is required.

on:
  push:
    branches:
      - claude/mesa-zoning-amendment-map-zfx2v0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        # Copy only the published assets — never .git (it holds credentials)
        # or CI config — into the artifact directory.
        run: |
          mkdir -p _site
          cp -r index.html css js vendor data .nojekyll _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
